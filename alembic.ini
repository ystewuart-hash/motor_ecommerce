# Configuración de Alembic — motor de migraciones del esquema.
# Guía de uso: docs/infraestructura_produccion_sprint4.md (sección 2).

[alembic]
script_location = %(here)s/alembic

# Nombre de archivo: fecha + id de revisión + descripción.
#   ej. 2026_10_06_0001_esquema_inicial.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40

# Permite importar database.py y models/ desde env.py.
prepend_sys_path = .
path_separator = os
output_encoding = utf-8

# La URL NO se escribe aquí: env.py la lee de DATABASE_URL (.env o entorno),
# para que las credenciales vivan en un solo lugar y nunca se versionen.
# sqlalchemy.url =


[post_write_hooks]
# Cada migración generada pasa por ruff para cumplir el linter del CI.
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME


# Logging de la CLI de Alembic (no afecta a la API, que usa core/logging.py).
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
